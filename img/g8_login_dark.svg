<!--
  Dartastic Hosted login background, dark theme. Placeholder — the
  design pass will refine this. Solid Argon ink (#172b4d) with a
  subtle blue→green gradient overlay so the customer sees Dartastic
  brand colors immediately on landing, not Grafana orange.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#324cdd" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#172b4d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1a2f" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
</svg>
