; Dartastic Hosted overlay for grafana.ini
;
; Dropped into /otel-lgtm/grafana/conf/custom.ini at image build time.
; Grafana auto-loads custom.ini after defaults.ini, so this layers
; cleanly on top of the upstream config shipped by grafana/otel-lgtm.
; Env vars (GF_*) still win — set those for per-deploy overrides.

[news]
; Disable the upstream "Latest from the blog" RSS feed that fetches
; grafana.com/blog/news.xml on every page load.  Our replaced
; home.json also drops the panel, but this kills any other surface
; that might pull the feed.
news_feed_enabled = false

[plugins]
; Disable the bundled `gettingstarted` panel plugin.  Grafana's home
; dashboard handler tries to auto-inject a panel of this type with
; "Welcome to Grafana" callouts + upstream tutorial links; with the
; plugin disabled the injection silently no-ops and customers see
; only our home.json content.
disable_plugins = gettingstarted

; Whitelist our bundled AI panel plugin.  Grafana refuses to load
; unsigned plugins by default — this overrides for our plugin
; only.  We sign nothing else, so the surface is bounded: only
; `dartastic-ai-panel` is allowed unsigned, and the source ships
; inside the same skin image (`/var/lib/grafana/plugins/
; dartastic-ai-panel/`).  See #85 P1.D.
allow_loading_unsigned_plugins = dartastic-ai-panel

[help]
; Hide the contextual help menu — most of its links point at
; grafana.com docs which lead the customer away from Dartastic.
enabled = false
