# Dartastic starter alert rules — THE BOX ITSELF (hosted#184).
#
# Split out of dartastic-starter-rules.yaml. These read the box's own
# hostmetrics sidecar (vultr/hostmetrics/otelcol-config.yaml), so they:
#   * are ORG 1 ONLY — never given to a tenant. A tenant can do nothing about
#     the shared box's disk, and its level is aggregate state across every
#     tenant on it.
#   * do not apply to Self-Hosted at all — a Kubernetes install runs no such
#     sidecar, and cluster health is the cluster operator's own monitoring.
#
# The app-level rules, which every tenant DOES get, are in
# dartastic-starter-rules-app.yaml. See that file's header for the contract.
apiVersion: 1

groups:
  # ── Your box ──────────────────────────────────────────────────────────
  - orgId: 1
    name: Dartastic starter — box health
    folder: Dartastic Alerts
    interval: 1m
    rules:
      - uid: dartastic_starter_disk
        title: Box disk is almost full
        condition: C
        for: 10m
        labels:
          severity: critical
          dartastic_starter: "true"
        annotations:
          summary: The box root filesystem is over 85% full
          description: >-
            Telemetry storage lives on this disk; when it fills, ingestion
            stops and data is lost. Free space or resize the volume.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: >-
                max(system_filesystem_usage_bytes{system_filesystem_state="used",mount="/"})
                / clamp_min(max(system_filesystem_usage_bytes{system_filesystem_state="used",mount="/"}) + max(system_filesystem_usage_bytes{system_filesystem_state="free",mount="/"}), 1)
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.85] }

      - uid: dartastic_starter_cpu
        title: Box CPU is saturated
        condition: C
        for: 10m
        labels:
          severity: warning
          dartastic_starter: "true"
        annotations:
          summary: The box has been over 90% CPU for 10 minutes
          description: >-
            Sustained high CPU can drop spans and slow queries. Check the
            Server Health dashboard; consider a larger box.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - avg(system_cpu_utilization{state="idle"})
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.9] }

      - uid: dartastic_starter_memory
        title: Box memory is under pressure
        condition: C
        for: 10m
        labels:
          severity: warning
          dartastic_starter: "true"
        annotations:
          summary: The box has been over 90% memory for 10 minutes
          description: >-
            Low free memory risks OOM-kills of the telemetry stack. Check the
            Server Health dashboard; consider a larger box.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: avg(system_memory_utilization{state="used"})
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.9] }

