# Dartastic starter alert rules (hosted#184).
#
# WHY THIS EXISTS: a box shipped with a working contact point (#131/#183) but
# ZERO rules — delivery of nothing alerts on nothing (dkatalis trial: a crash
# happened, nobody got an email). This ships a small starter pack so the box
# does something useful the moment a destination exists, exactly like the
# pre-loaded dashboards.
#
# HOW IT WORKS:
#  - File-provisioned, so the rules are re-asserted on every restart and render
#    read-only in the UI (same model as dartastic-dashboards.yaml). A customer
#    who wants to tune a threshold duplicates the rule; the starter stays a
#    stable safety floor. (Contrast the notification POLICY, which is
#    deliberately NOT file-provisioned — see dartastic-default.yaml #183.)
#  - Every rule is left UNROUTED (no explicit route): it falls through to the
#    default notification policy, whose default-email floor route the box
#    reconciler keeps present (grafana-notify-reconcile.sh, #183). So a firing
#    rule reaches the box-admin email (or the customer's Slack/route) with no
#    per-rule wiring.
#  - All queries are Prometheus (uid "prometheus") and reuse the exact metric
#    names the shipped dashboards use, so they light up for a customer on the
#    Dartastic native OTel SDK (the same "works when you use _native" contract
#    as the dashboards, #178). App rules group BY service, so a box with no
#    apps yet produces no firing instances — no noise before setup. The
#    box-health rules use the host-metric names that only the box's own
#    hostmetrics sidecar emits (vultr/hostmetrics/otelcol-config.yaml), so they
#    monitor the box itself and have data from day one.
#
# TUNING: thresholds are conservative starting points, documented per rule.
apiVersion: 1

groups:
  # ── Your apps ─────────────────────────────────────────────────────────
  - orgId: 1
    name: Dartastic starter — app health
    folder: Dartastic Alerts
    interval: 1m
    rules:
      - uid: dartastic_starter_error_rate
        title: App error rate is elevated
        condition: C
        for: 5m
        labels:
          severity: warning
          dartastic_starter: "true"
        annotations:
          summary: A service is producing errors faster than expected
          description: >-
            Error spans for {{ $labels.service_name }} are arriving faster than
            0.1/s over the last 5 minutes. Open the Crashes and Flutter App
            Health dashboards to see what changed. Tune this threshold by
            duplicating the rule.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum by (service_name) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.1] }

      - uid: dartastic_starter_crashes
        title: App crashes detected
        condition: C
        for: 0m
        labels:
          severity: critical
          dartastic_starter: "true"
        annotations:
          summary: A crashed session was recorded
          description: >-
            {{ $labels.service_name }} {{ $labels.app_version }} recorded a
            crashed session in the last 10 minutes. Open the Crashes —
            Symbolized dashboard for the source-mapped stack trace.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum by (service_name, app_version) (increase(flutter_session_count_total{session_status="crashed"}[10m]))
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0] }

      - uid: dartastic_starter_no_telemetry
        title: No telemetry is arriving from your apps
        condition: C
        for: 1h
        labels:
          severity: warning
          dartastic_starter: "true"
        annotations:
          summary: The box has stopped receiving spans from your apps
          description: >-
            No error/traffic spans have been received for over an hour. If your
            apps are live this usually means broken instrumentation (SDK not
            initialised, wrong endpoint or API key). Expected to fire on a new
            box until your first app connects — duplicate and pause if not
            wanted yet.
        noDataState: Alerting
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum(rate(traces_spanmetrics_calls_total[10m]))
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              # Never true when data is present (a rate is >= 0); the alert is
              # driven purely by noDataState=Alerting when the series vanishes.
              conditions:
                - type: query
                  evaluator: { type: lt, params: [0] }

  # ── Your box ──────────────────────────────────────────────────────────
  - orgId: 1
    name: Dartastic starter — box health
    folder: Dartastic Alerts
    interval: 1m
    rules:
      - uid: dartastic_starter_disk
        title: Box disk is almost full
        condition: C
        for: 10m
        labels:
          severity: critical
          dartastic_starter: "true"
        annotations:
          summary: The box root filesystem is over 85% full
          description: >-
            Telemetry storage lives on this disk; when it fills, ingestion
            stops and data is lost. Free space or resize the volume.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: >-
                max(system_filesystem_usage_bytes{state="used",mount="/"})
                / clamp_min(max(system_filesystem_usage_bytes{state="used",mount="/"}) + max(system_filesystem_usage_bytes{state="free",mount="/"}), 1)
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.85] }

      - uid: dartastic_starter_cpu
        title: Box CPU is saturated
        condition: C
        for: 10m
        labels:
          severity: warning
          dartastic_starter: "true"
        annotations:
          summary: The box has been over 90% CPU for 10 minutes
          description: >-
            Sustained high CPU can drop spans and slow queries. Check the
            Server Health dashboard; consider a larger box.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - avg(system_cpu_utilization{state="idle"})
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.9] }

      - uid: dartastic_starter_memory
        title: Box memory is under pressure
        condition: C
        for: 10m
        labels:
          severity: warning
          dartastic_starter: "true"
        annotations:
          summary: The box has been over 90% memory for 10 minutes
          description: >-
            Low free memory risks OOM-kills of the telemetry stack. Check the
            Server Health dashboard; consider a larger box.
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: avg(system_memory_utilization{state="used"})
              instant: false
              range: true
              intervalMs: 30000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.9] }
