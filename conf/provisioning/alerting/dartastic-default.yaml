# Dartastic default alert-notification wiring (hosted#131).
#
# WHY THIS EXISTS: Grafana ships the alerting UI on, so customers create alert
# RULES — but with no contact point + no SMTP, a firing rule has nowhere to go
# ("Alert notifications failed to send", first-customer feedback). This file
# gives every box a working default: one email contact point + a default policy
# routing all alerts to it. SMTP transport is configured separately via
# GF_SMTP_* env (see docker-compose.dartastic.yml) — the Dartastic SendGrid relay by
# default, or a customer's BYO SMTP.
#
# The destination address is per-box, injected from the box's Doppler config as
# $ADMIN_ALERT_EMAIL (Grafana interpolates env vars in provisioning files).
# docker-compose sets a non-empty compose-level default so this can't provision
# an empty address.
#
# NOTE (#183, owner decision 2026-07-06): this file provisions ONLY the default
# CONTACT POINT (read-only in the UI — it's ours, the safety floor). The
# notification POLICY is deliberately NOT file-provisioned: a file policy is
# re-asserted on every Grafana restart (wiping customer routes) AND renders the
# whole policy UI read-only. Instead the box reconciler
# (vultr/grafana-notify-reconcile.sh, run at deploy + every ~5 min) MERGES the
# default-email floor route into the live tree via the API with
# X-Disable-Provenance — customer-authored routes and root tweaks survive, and
# the native notification-policies UI stays fully editable for the customer.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Dartastic default email
    receivers:
      - uid: dartastic_default_email
        type: email
        settings:
          # Comma-separated addresses supported; single box-admin address here.
          addresses: ${ADMIN_ALERT_EMAIL}
        # Send even when an alert group has multiple alerts.
        disableResolveMessage: false

